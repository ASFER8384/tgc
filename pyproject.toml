[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tgc-sca"
version = "0.1.0"
description = "Supplier coordination automation for TGC (Aleena / Rawash / Aynola)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  # Windows ships no IANA timezone database, and every scheduling decision here
  # depends on one. A hard dependency rather than a platform marker: the service
  # must behave identically wherever it runs.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

# The console page ships inside the package: the API serves it, so it has to be
# installed alongside the code rather than left behind in the source tree.
[tool.setuptools.package-data]
sca = ["console/*.html"]
cdp = ["console/*.html"]

# setuptools is the build backend; this repeats the src layout for Poetry, which
# does not read the key above. Some hosts autodetect Poetry whenever they see a
# pyproject.toml and fail the build without it.
[tool.poetry]
packages = [{ include = "sca", from = "src" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  # SQLite has no native DECIMAL. Money is Numeric(14, 2) because production is
  # Postgres; the test dialect converting through float is expected, and every
  # money assertion in the suite is exact to two places regardless.
  "ignore:.*does \\*not\\* support Decimal objects natively.*:Warning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
