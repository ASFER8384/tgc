services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tgc_sca
    # Deliberately not 5433: the CDP uses that, and the two services are expected
    # to run side by side on a developer machine.
    ports:
      - "5434:5432"
    volumes:
      - sca_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tgc_sca"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6381:6379"

volumes:
  sca_pg:
